name: flowline
description: A local-first focus and schedule workspace.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^14.2.0
  drift: ^2.35.1
  # sqlite3 3.x bundles SQLite itself through Dart build hooks, so the old
  # sqlite3_flutter_libs package is no longer needed (it's end-of-life).
  # Imported directly for sqlite3.tempDirectory (see app_database.dart).
  sqlite3: ^3.7.0
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.2
  # Timer and date logic read time through `clock` so tests can drive it
  # (testWidgets' FakeAsync overrides clock.now()). Already resolved
  # transitively at 1.1.2; listed directly because lib/ imports it.
  clock: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
