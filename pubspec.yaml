name: atomic_assist
description: "Atomic Assist (AA). A local-first personal assistant for tasks, time blocks and focus, with an assistant that listens and acts. Part of the DevBehindYou Atomic family."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.2
  drift: ^2.35.1
  # sqlite3 3.x bundles SQLite itself through Dart build hooks, so the old
  # sqlite3_flutter_libs package is no longer needed (it's end-of-life).
  # Imported directly for sqlite3.tempDirectory (see app_database.dart).
  sqlite3: ^3.7.0
  path_provider: ^2.1.6
  path: ^1.9.0
  intl: ^0.20.2
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  dio: ^5.11.1
  # Held at 10.x: it migrates keys saved by 9.x (Jetpack Security) to its
  # new cipher; 11.x can't read them. See secure_key_store.dart.
  flutter_secure_storage: ^10.3.4
  fl_chart: ^1.2.0
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.0
  # Timer and date logic read time through `clock` so tests can drive it
  # (testWidgets' FakeAsync overrides clock.now()). Already resolved
  # transitively at 1.1.2; listed directly because lib/ imports it.
  clock: ^1.1.1
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
  # gen-l10n: lib/l10n/*.arb -> lib/l10n/app_localizations*.dart (l10n.yaml).
  generate: true

  # SIL OFL 1.1; licence texts sit next to the files and are registered
  # with the LicenseRegistry in main.dart.
  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

  assets:
    - assets/fonts/BebasNeue-OFL.txt
    - assets/fonts/HankenGrotesk-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
