name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pinned for determinism — CI is the only place this project builds and
# tests. Bump it only together with the code-generation stack
# (riverpod_generator, drift_dev, build_runner and the analyzer they
# share), and re-check tool/ci/android_patches.dart against the new
# Android template: on 3.35 the pinned analyzer crashed on a newer SDK and
# build_runner hung for 5.5 hours (see docs/04, rule R19).
env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  analyze:
    name: Format, analyze, test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter / Dart versions
        run: flutter --version

      - name: flutter pub get
        run: flutter pub get

      - name: Generate Drift + Riverpod code
        id: codegen
        timeout-minutes: 10
        run: dart run build_runner build

      # Tracked files only: build_runner output is formatted by its own
      # bundled dart_style and must not fail this check.
      - name: dart format (tracked files)
        id: format
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')

      # Analyze and test still run after a format failure so one CI run
      # reports every problem, while the job as a whole still fails.
      - name: flutter analyze
        id: analyze
        if: ${{ !cancelled() && steps.codegen.outcome == 'success' }}
        run: flutter analyze

      - name: flutter test --coverage
        id: test
        if: ${{ !cancelled() && steps.codegen.outcome == 'success' }}
        timeout-minutes: 10
        run: flutter test --coverage --reporter expanded

      # The runner is UTC, which has no daylight-saving changes, so DST
      # bugs (B1: 23/25-hour days) can't fail there. Re-run the suites that
      # do calendar math under a DST zone.
      - name: Time-sensitive tests under a DST timezone
        if: ${{ !cancelled() && steps.codegen.outcome == 'success' }}
        timeout-minutes: 5
        env:
          TZ: America/New_York
        run: flutter test test/domain test/core test/data/repositories

      - name: Upload coverage
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      # Golden tests (test/goldens) run in the test step above. On a
      # mismatch flutter_test writes the expected, actual and diff images
      # under test/goldens/failures/; hand them back for review. If the
      # change is intended: flutter test --update-goldens test/goldens.
      - name: Upload golden diffs
        if: ${{ !cancelled() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: test/goldens/failures/
          retention-days: 14
          if-no-files-found: ignore

      # There is no local formatter, so hand back the exact fix instead
      # of only a list of files: `git apply format.patch`.
      - name: Build formatter patch
        if: ${{ !cancelled() && steps.format.outcome == 'failure' }}
        run: |
          dart format $(git ls-files '*.dart') > /dev/null
          git diff > format.patch
          git --no-pager diff --stat

      - name: Upload formatter patch
        if: ${{ !cancelled() && steps.format.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: format-patch
          path: format.patch
          retention-days: 7

  # The real app on an Android emulator: startup, routing from a fresh
  # install, the SQLite file and the plugins (docs/04 §7). Widget tests
  # fake all of these.
  integration:
    name: Integration tests (Android emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Hardware acceleration for the x86_64 emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate and patch android/
        run: |
          flutter create --platforms android --org com.devbehindyou .
          dart run tool/ci/patch_android.dart android

      - name: flutter pub get
        run: flutter pub get

      - name: Generate Drift + Riverpod code
        timeout-minutes: 10
        run: dart run build_runner build

      - name: Run integration_test on an API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: flutter test integration_test --reporter expanded

  android-build:
    name: Android release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # No `cache: gradle` here: setup-java hashes Gradle files at this
      # point, and android/ doesn't exist until `flutter create` below.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate android/ platform folder
        # android/ is intentionally gitignored (see README "Before you
        # build") so it always comes from the pinned Flutter's template
        # rather than hand-maintained, stale Gradle/AGP files.
        run: flutter create --platforms android --org com.devbehindyou .

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Apply Flowline's manifest + Gradle requirements
        run: dart run tool/ci/patch_android.dart android

      - name: flutter pub get
        run: flutter pub get

      - name: Generate Drift + Riverpod code
        timeout-minutes: 10
        run: dart run build_runner build

      # One stable release key (repository secrets) so every CI build can
      # be installed over the previous one. Without it each fresh runner
      # signs with a new throwaway debug key, and Android only accepts the
      # update after an uninstall, which deletes the app's local data.
      # Without the secrets (forks, PRs from forks, before setup) a
      # throwaway key is generated instead, so the release signing path is
      # still exercised on every run, with a warning that the APK can't
      # update an existing install.
      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release signing not configured::ANDROID_KEYSTORE_BASE64 is not set, so this APK is signed with a throwaway key and cannot be installed over another build. See README > Release signing."
            KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            KEY_PASSWORD="${KEYSTORE_PASSWORD}"
            KEY_ALIAS="ephemeral"
            keytool -genkeypair -keystore android/app/flowline-release.jks \
              -storetype PKCS12 -alias "${KEY_ALIAS}" -keyalg RSA -keysize 2048 \
              -validity 30 -storepass "${KEYSTORE_PASSWORD}" -keypass "${KEY_PASSWORD}" \
              -dname "CN=Flowline CI throwaway" > /dev/null
          else
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > android/app/flowline-release.jks
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "storeFile=flowline-release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/key.properties

      # The run number makes versionCode increase on every build, which
      # Android requires for an update to install.
      - name: flutter build apk --release --split-per-abi
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Verify APK signature and version
        id: verify
        run: |
          set -euo pipefail
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          expected="$(tr -d '[:space:]' < tool/ci/release_cert_sha256.txt)"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            actual="$("${tools}apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            version="$("${tools}aapt2" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
            echo "$(basename "$apk"): versionCode=${version} cert=${actual}"
            if [ "${{ steps.signing.outputs.configured }}" = "true" ] && [ "$actual" != "$expected" ]; then
              echo "::error title=Wrong signing key::$(basename "$apk") is signed with ${actual}, expected ${expected} (tool/ci/release_cert_sha256.txt)."
              exit 1
            fi
          done
          echo "cert=${actual}" >> "$GITHUB_OUTPUT"

      - name: Rename APKs with commit SHA
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA:0:7}"
          outdir="build/app/outputs/flutter-apk"
          for apk in "$outdir"/app-*-release.apk; do
            base="$(basename "$apk" .apk)"
            cp "$apk" "$outdir/flowline-${base#app-}-${sha}.apk"
          done
          ls -la "$outdir"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flowline-release-apks-${{ github.sha }}
          path: build/app/outputs/flutter-apk/flowline-*-release-*.apk
          retention-days: 30

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Flowline Android build"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Flutter: ${FLUTTER_VERSION}"
            if [ "${{ steps.signing.outputs.configured }}" = "true" ]; then
              echo "- Signing: release key \`${{ steps.verify.outputs.cert }}\` (installs over earlier builds)"
            else
              echo "- Signing: :warning: **throwaway key** \`${{ steps.verify.outputs.cert }}\` — this APK will not install over another build. Add the ANDROID_* secrets (README > Release signing)."
            fi
            echo "- Build number (versionCode base): ${{ github.run_number }}"
            echo "- APKs:"
            ls build/app/outputs/flutter-apk/flowline-*.apk 2>/dev/null | sed 's#.*/#  - #' || echo "  - none (build failed)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-logs
          path: |
            android/app/build/outputs/logs/**
            **/*.log
          retention-days: 7
          if-no-files-found: ignore
